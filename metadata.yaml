name: astrbot_plugin_chem_structure
display_name: 化学结构简式
short_desc: 输入名称/SMILES/简式/分子式，自动画出结构简式与键线式
description: >-
  把中文名、俗名、SMILES、结构简式或分子式画成结构简式图片，并给出分子式、
  相对分子质量、元素质量分数等信息。环烷烃、苯、萘这类没有连写式简式的物质
  会自动改用自研的纯 Python 引擎画键线式（不需要 RDKit）；装了 RDKit 还能
  额外绘制 RDKit 结构式。内置 140 条常见物质词表，含 WebUI 预览页。
version: 1.0.0
author: NekoHome Studio
repo: https://github.com/NekoHome-Studio/neko-chem
license: "MIT"
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - discord
  - slack
  - wecom
  - lark
  - dingtalk
  - kook
  - satori
  - misskey
  - line
  - matrix
  - mattermost
  - webchat
